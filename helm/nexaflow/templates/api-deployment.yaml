apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaflow-api
  namespace: {{ .Values.namespace }}
  labels:
    app: nexaflow-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: nexaflow-api
  template:
    metadata:
      labels:
        app: nexaflow-api
    spec:
      containers:
        - name: nexaflow-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
          envFrom:
            - configMapRef:
                name: nexaflow-api-config
            - secretRef:
                name: nexaflow-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
