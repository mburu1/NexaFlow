apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaflow-kafka
  namespace: {{ .Values.namespace }}
  labels:
    app: nexaflow-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexaflow-kafka
  template:
    metadata:
      labels:
        app: nexaflow-kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://nexaflow-kafka:9092"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@nexaflow-kafka:9093"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexaflow-kafka
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: nexaflow-kafka
  ports:
    - port: 9092
      targetPort: 9092
