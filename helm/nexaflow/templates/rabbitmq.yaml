apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaflow-rabbitmq
  namespace: {{ .Values.namespace }}
  labels:
    app: nexaflow-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexaflow-rabbitmq
  template:
    metadata:
      labels:
        app: nexaflow-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: nexaflow-api-secrets
                  key: RabbitMq__UserName
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: nexaflow-api-secrets
                  key: RabbitMq__Password
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexaflow-rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: nexaflow-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
