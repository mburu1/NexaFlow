# Template only. Copy to secret.yaml, fill in real values, and never commit that file
# (it's covered by .gitignore's **/secrets.json pattern intent — add k8s/secret.yaml
# to .gitignore explicitly if you create it).
apiVersion: v1
kind: Secret
metadata:
  name: nexaflow-api-secrets
  namespace: nexaflow
type: Opaque
stringData:
  ConnectionStrings__MsSql: "Server=YOUR_SQL_SERVER;Database=NexaFlow;User Id=YOUR_USER;Password=YOUR_PASSWORD;TrustServerCertificate=True"
  Jwt__SigningKey: "REPLACE_WITH_A_STRONG_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
  RabbitMq__UserName: "YOUR_RABBITMQ_USER"
  RabbitMq__Password: "YOUR_RABBITMQ_PASSWORD"
